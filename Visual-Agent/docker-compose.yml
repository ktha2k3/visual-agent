services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visual_agent
      POSTGRES_USER: visual_agent
      POSTGRES_PASSWORD: visual_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visual_agent -d visual_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    environment:
      REDIS_ARGS: --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-exclude
      - data/*.py
      - --reload-exclude
      - data/*/*.py
      - --reload-exclude
      - data/*/*/*.py
      - --reload-exclude
      - data/*/*/*/*.py
      - --reload-exclude
      - tests/*.py
      - --timeout-keep-alive
      - "120"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      EMBEDDING_BASE_URL: ${DOCKER_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://visual_agent:visual_agent@postgres:5432/visual_agent
      DEBUG_STREAM: "false"
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - knowledge_uploads:/app/assets/knowledge-uploads
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    command: ["python", "worker.py"]
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      EMBEDDING_BASE_URL: ${DOCKER_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://visual_agent:visual_agent@postgres:5432/visual_agent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - knowledge_uploads:/app/assets/knowledge-uploads
      - app_data:/app/data
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    command: ["sh", "-c", "python scheduler.py && rqscheduler --url redis://redis:6379"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://visual_agent:visual_agent@postgres:5432/visual_agent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - app_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  knowledge_uploads:
  app_data:
