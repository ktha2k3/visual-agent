[project]
name = "visual-agent"
version = "0.1.0"
description = "Visual Agent"
authors = [
    {name = "ktha",email = "khongtronghoanganh@gmail.com"}
]
readme = "README.md"
requires-python = "^3.11,<4.0"
dependencies = [
    "langchain (==0.3.24)",
    "langchain-core (==0.3.56)",
    "langchain-community (==0.3.23)",
    "langchain-text-splitters (==0.3.8)",
    "langchain-openai (==0.3.14)",
    "langchain-tavily (==0.1.6)",
    "langgraph (==0.3.33)",
    "langgraph-supervisor (==0.0.16)",
    "arxiv (==2.1.3)",
    "wikipedia (==1.4.0)",
    "duckduckgo-search (==6.3.7)",
    "python-magic (==0.4.27)",
    "ultralytics (==8.3.108)",
    "ipython (>=9.14.0,<10.0.0)",
    "pydantic (>=2.13.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
