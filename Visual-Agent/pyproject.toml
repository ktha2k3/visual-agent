[project]
name = "visual-agent"
version = "0.1.0"
description = "Visual Agent"
authors = [
    { name = "ktha",email = "khongtronghoanganh@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain (==1.3.15)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-openai (==1.5.1)",
    "langgraph (==1.2.11)",
    "langchain-tavily (>=0.2.0,<0.3.0)",
    "arxiv (==2.1.3)",
    "wikipedia (==1.4.0)",
    "ipython (>=9.0.0,<10.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "fastapi (>=0.115.0)",
    "uvicorn[standard] (>=0.30.0)",
    "python-dotenv (>=1.0.0)",
    "python-multipart (>=0.0.9)",
    "langgraph-checkpoint-redis (==0.5.1)",
    "python-magic-bin (==0.4.14)",
    "httpx (>=0.28.0,<1.0.0)",
    "pyjwt[crypto] (>=2.10.0,<3.0.0)",
    "pillow (>=11.0.0,<13.0.0)",
    "redis (>=5.2.0,<7.0.0)",
    "rq (>=2.1.0,<3.0.0)",
    "rq-scheduler (>=0.14.0,<0.15.0)",
    "sympy (>=1.13.0,<2.0.0)",
    "pint (>=0.24.0,<1.0.0)",
    "pypdf (>=5.0.0,<7.0.0)",
    "psycopg[binary,pool] (>=3.2.0,<4.0.0)",
    "manim (>=0.19.0,<0.20.0)"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "coverage>=7.6.0,<8.0.0"
]
yolo = [
    "ultralytics==8.3.108"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
